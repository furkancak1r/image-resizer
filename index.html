<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Frame Resizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🖼️ Image Frame Resizer</h1>
            <p class="subtitle">Fotoğraflarınızı istediğiniz çerçeve boyutuna göre yeniden boyutlandırın</p>
        </header>

        <div class="controls-panel">
            <div class="control-group">
                <label for="frameWidth">Çerçeve Genişliği (px)</label>
                <input type="number" id="frameWidth" value="1280" min="1">
            </div>
            <div class="control-group">
                <label for="frameHeight">Çerçeve Yüksekliği (px)</label>
                <input type="number" id="frameHeight" value="800" min="1">
            </div>
            <div class="control-group">
                <label for="bgColor">Dolgu Rengi (Hex)</label>
                <div class="color-input-wrapper">
                    <input type="text" id="bgColor" value="#000000" placeholder="#000000">
                    <input type="color" id="colorPicker" value="#000000">
                </div>
            </div>
            <div class="control-group btn-group">
                <button id="processBtn" class="btn btn-process" disabled>🖼️ Oluştur</button>
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <div class="upload-icon">📁</div>
                <p>Fotoğrafları buraya sürükleyip bırakın veya</p>
                <button type="button" class="upload-btn" id="selectFilesBtn">Dosya Seçin</button>
                <input type="file" id="fileInput" accept="image/*" multiple hidden>
                <p class="hint">PNG, JPG, WEBP desteklenir • Birden fazla dosya seçebilirsiniz</p>
                <div id="pendingCount" class="pending-count" style="display: none;"></div>
            </div>
        </div>

        <div class="pending-section" id="pendingSection" style="display: none;">
            <div class="section-header">
                <h2>📷 Seçilen Fotoğraflar</h2>
                <button id="clearPendingBtn" class="btn btn-secondary">🗑️ Temizle</button>
            </div>
            <div class="pending-grid" id="pendingGrid"></div>
        </div>

        <div class="images-section" id="imagesSection" style="display: none;">
            <div class="section-header">
                <h2>Yüklenen Görseller</h2>
                <div class="action-buttons">
                    <button id="downloadAllBtn" class="btn btn-primary">
                        ⬇️ Tümünü İndir
                    </button>
                    <button id="clearAllBtn" class="btn btn-secondary">
                        🗑️ Temizle
                    </button>
                </div>
            </div>
            <div class="images-grid" id="imagesGrid"></div>
        </div>
    </div>

    <canvas id="processingCanvas" style="display: none;"></canvas>
    <script src="app.js"></script>
</body>

</html>
